name: build
on:
  push:
  pull_request:
jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No Unicode normalization of Hebrew
        run: |
          if grep -RIn --include='*.py' -E 'unicodedata\.normalize|\.normalize\(' builder; then
            echo "Hebrew must not be Unicode-normalized"
            exit 1
          fi
      - run: python -m unittest discover -s tests
